name: Título del PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Formato Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            spike
            build
            ci
            revert
          scopes: |
            core
            model
            codegen
            world
            compile
            layout
            ops
            snap
            cli
            tauri
            ui
            canvas
            text
            deps
            ci
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            El asunto "{subject}" debe empezar en minúscula y en imperativo.
            Ejemplo: feat(codegen): emit place() wrapper for rect elements
