name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Durante la Fase 0 el workspace de Cargo y el frontend todavía no existen.
  # Este job decide qué comprobaciones tienen sentido en el commit actual,
  # para que CI esté en verde desde el primer día sin dar falsos positivos.
  detect:
    name: Detectar qué hay en el repo
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --all-features

  frontend:
    name: Interfaz
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobación de tipos
        run: pnpm run -s typecheck --if-present

      - name: Lint
        run: pnpm run -s lint --if-present

      - name: Pruebas
        run: pnpm run -s test --if-present

      - name: Build
        run: pnpm run -s build --if-present

  # Check único al que apunta la protección de la rama main.
  ci:
    name: CI
    if: always()
    needs: [detect, rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          echo "detect:   ${{ needs.detect.result }}"
          echo "rust:     ${{ needs.rust.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          for r in "${{ needs.detect.result }}" "${{ needs.rust.result }}" "${{ needs.frontend.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Un job requerido no pasó ($r)"; exit 1 ;;
            esac
          done
