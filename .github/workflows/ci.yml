name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Durante la Fase 0 el workspace de Cargo y el frontend todavía no existen.
  # Este job decide qué comprobaciones tienen sentido en el commit actual,
  # para que CI esté en verde desde el primer día sin dar falsos positivos.
  detect:
    name: Detectar qué hay en el repo
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  # La versión de Cargo.toml, de package.json y de tauri.conf.json es la
  # misma: al etiquetar, el workflow de empaquetado exige además que la
  # etiqueta lo sea (F8-07, #94).
  version:
    name: La versión cuadra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-version.sh

  rust:
    name: Rust (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --all-features

      # Las pruebas de galera-core regeneran los tipos TypeScript del modelo
      # en app/src/types. Si cambian, alguien tocó el modelo sin regenerarlos.
      - name: Tipos TypeScript al día
        shell: bash
        run: |
          changes=$(git status --porcelain -- app/src/types)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/src/types
            echo "::error::app/src/types no coincide con el modelo de Rust. Ejecuta 'cargo test -p galera-core export_bindings' y sube los cambios."
            exit 1
          fi

      # El mismo JSON tiene que dar el mismo PDF en todos los sistemas: las
      # fuentes son las del proyecto y el PDF no lleva fecha. Cada sistema
      # saca el de cada fixture, y el job `pdf` los compara byte a byte.
      - name: PDF de cada fixture
        shell: bash
        run: |
          mkdir -p pdf
          for fixture in fixtures/*.json; do
            name=$(basename "$fixture" .json)
            cargo run -q -p galera-cli -- "$fixture" -o "pdf/$name.pdf"
          done
          ls pdf

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-${{ matrix.os }}
          path: pdf/
          if-no-files-found: error

  pdf:
    name: El mismo PDF en todos los sistemas
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pdf-*

      - name: Comparar byte a byte
        run: |
          reference=pdf-ubuntu-latest
          count=$(ls "$reference" | wc -l)
          echo "$count PDF por sistema"
          [ "$count" -gt 0 ] || { echo "::error::No hay PDF que comparar"; exit 1; }
          status=0
          for other in pdf-macos-latest pdf-windows-latest; do
            if ! diff <(ls "$reference") <(ls "$other"); then
              echo "::error::$other no tiene los mismos PDF"
              status=1
            fi
            for file in "$reference"/*.pdf; do
              name=$(basename "$file")
              if ! cmp -s "$file" "$other/$name"; then
                echo "::error::$name sale distinto en $other"
                status=1
              fi
            done
          done
          [ "$status" -eq 0 ] && sha256sum "$reference"/*.pdf
          exit "$status"

  frontend:
    name: Interfaz
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Vite 8 exige Node 20.19 o 22.12+. La versión de pnpm la fija el
          # campo `packageManager` de package.json.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--if-present` va antes del nombre del script: lo que va detrás se
      # pasa al propio script, y acabaría como argumento de tsc o vitest.

      - name: Comprobación de tipos
        run: pnpm run --if-present -s typecheck

      - name: Lint
        run: pnpm run --if-present -s lint

      - name: Pruebas
        run: pnpm run --if-present -s test

      - name: Build
        run: pnpm run --if-present -s build

  # Check único al que apunta la protección de la rama main.
  ci:
    name: CI
    if: always()
    needs: [detect, version, rust, pdf, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          echo "detect:   ${{ needs.detect.result }}"
          echo "version:  ${{ needs.version.result }}"
          echo "rust:     ${{ needs.rust.result }}"
          echo "pdf:      ${{ needs.pdf.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          for r in "${{ needs.detect.result }}" "${{ needs.version.result }}" "${{ needs.rust.result }}" "${{ needs.pdf.result }}" "${{ needs.frontend.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Un job requerido no pasó ($r)"; exit 1 ;;
            esac
          done
