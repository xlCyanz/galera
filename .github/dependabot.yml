version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore", "area:build"]
    ignore:
      # Las versiones de los crates de Typst se fijan a mano y se suben
      # de forma deliberada, porque su API cambia entre versiones menores.
      - dependency-name: "typst*"

  - package-ecosystem: cargo
    directory: "/app/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore", "area:tauri"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore", "area:ui"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels: ["chore", "area:build"]
