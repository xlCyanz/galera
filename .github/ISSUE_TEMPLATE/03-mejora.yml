name: Mejora
description: Propuesta de función o cambio no planificado en la hoja de ruta.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Describe el problema, no la solución.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: dropdown
    id: fase
    attributes:
      label: Fase donde encajaría
      options:
        - "Fase 0"
        - "Fase 1"
        - "Fase 2"
        - "Fase 3"
        - "Fase 4"
        - "Fase 5"
        - "Fase 6"
        - "Fase 7"
        - "Fase 8"
        - "Después de la 8 / sin decidir"
    validations:
      required: true
  - type: checkboxes
    id: alcance
    attributes:
      label: Comprobaciones
      options:
        - label: No está en la lista de "fuera de alcance" del README.
          required: true
        - label: No rompe ninguno de los seis principios del README.
          required: true
