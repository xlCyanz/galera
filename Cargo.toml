# Workspace de Galera.
#
# Dos crates, deliberadamente separados:
#   - galera-core: toda la lógica (modelo, codegen, compilación, layout).
#     No conoce ni Tauri ni ninguna interfaz, para poder reutilizarlo
#     después desde Swift o WASM (principio 5 del README).
#   - galera-cli:  herramienta de terminal que usa el núcleo sin interfaz.
#
#   - app/src-tauri: el backend de la app de escritorio (Tauri).

[workspace]
resolver = "3"
members = ["crates/galera-core", "crates/galera-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/xlCyanz/galera"
authors = ["Johan Sierra"]

[workspace.dependencies]
galera-core = { path = "crates/galera-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Tauri también se fija con `=`: la versión del crate tiene que casar con la
# de `@tauri-apps/api` y `@tauri-apps/cli` en `app/package.json`.
tauri = "=2.11.5"
tauri-build = "=2.6.3"
# El plugin del diálogo se usa solo desde Rust, sin paquete de npm; se fija
# igual para que suba a la vez que Tauri y no por su cuenta.
tauri-plugin-dialog = "=2.7.3"
insta = "1.43"
# Genera los tipos TypeScript del modelo desde las pruebas de galera-core.
ts-rs = "12.0"

# La memoización de Typst: reutilizar entre compilaciones lo que no cambia
# (ver `compile/cache.rs`). La versión es la que trae Typst.
comemo = "=0.5.1"

# Typst se fija con `=`: su API cambia entre versiones menores, así que
# subirla es una decisión deliberada con su propio PR, nunca un efecto
# secundario de `cargo update`. Todas van siempre a la par.
typst = "=0.15.1"
typst-assets = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
tempfile = "3"
# Clústeres de grafemas: mover el cursor por lo que una persona percibe como
# un carácter, no por bytes ni por puntos de código (ver `model/text.rs`).
# Typst ya la trae, así que no añade nada nuevo al árbol de dependencias.
unicode-segmentation = "1.13"
miniz_oxide = "0.9"

# Compilar Typst en modo depuración es lento de más para trabajar con él,
# así que las dependencias se optimizan aunque el código propio no.
[profile.dev.package."*"]
opt-level = 2
