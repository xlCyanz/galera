[package]
name = "galera-core"
description = "Núcleo de Galera: modelo de documento, generación de Typst, compilación y layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Solo para comprimir y descomprimir dentro del `.galera` (ver `zip.rs`).
comemo.workspace = true
miniz_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
typst.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-render.workspace = true
typst-svg.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
ts-rs.workspace = true
typst-assets = { workspace = true, features = ["fonts"] }

# El banco de pruebas de compilación (`cargo bench -p galera-core`). Sin
# `harness`: es un programa normal que imprime lo que mide, no `#[bench]`.
[[bench]]
name = "compile"
harness = false
